    /* ---------- charts compartidos ---------- */
    // Series temporales: si hay muchos días, ensancha el lienzo y deja que el
    // contenedor .chart-scroll se desplace en horizontal.
    function fitDays(id, count, pxPerCol = 40, minVisible = 12) {
      const box = $(`#${id}`) && $(`#${id}`).closest('.chart-box');
      if (!box) return;
      box.style.minWidth = count > minVisible ? `${count * pxPerCol}px` : '100%';
    }
    // Etiqueta de día compacta y legible ("mié 2", "1 oct" al cambiar de mes).
    function dayTick(iso, prevIso) {
      const d = new Date(`${iso}T12:00:00Z`);
      const day = Number(iso.slice(-2));
      const newMonth = !prevIso || iso.slice(0, 7) !== prevIso.slice(0, 7);
      if (newMonth) return `${day} ${d.toLocaleDateString('es-CO', { month: 'short', timeZone: TZ }).replace('.', '')}`;
      return `${d.toLocaleDateString('es-CO', { weekday: 'short', timeZone: TZ }).replace('.', '')} ${day}`;
    }
    const dayTicks = (isos) => isos.map((iso, i) => dayTick(iso, isos[i - 1]));

    function hbar(id, labels, values, opts = {}) {
      const el = $(`#${id}`); if (!el) return;
      const box = el.closest('.chart-box');
      if (box && !opts.keepHeight) box.style.height = `${Math.min(560, Math.max(170, labels.length * 34 + 36))}px`;
      charts[id] = new window.Chart(el, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: opts.colors || cssVar('--series-1'), borderRadius: 5, borderSkipped: 'start', maxBarThickness: 26 }] },
        options: {
          indexAxis: 'y',
          layout: { padding: { right: opts.padRight || 44 } },
          plugins: {
            legend: { display: false },
            datalabels: { anchor: 'end', align: 'end', clamp: true, color: cssVar('--text-secondary'), font: { size: 11, weight: '600' }, formatter: opts.formatter || ((v) => nf.format(v)) },
            tooltip: { callbacks: opts.tooltip || {} },
          },
          scales: { x: { ...yGrid() }, y: { ...xCat() } },
        },
        plugins: DL(),
      });
    }
    function areaChart(id, labels, values) {
      const el = $(`#${id}`); if (!el) return;
      const line = cssVar('--accent');
      charts[id] = new window.Chart(el, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: values, borderColor: line, borderWidth: 2, tension: 0.35, fill: true, pointRadius: 0, pointHoverRadius: 4,
            backgroundColor: (ctx) => {
              const { chart } = ctx; const { ctx: c, chartArea } = chart;
              if (!chartArea) return 'transparent';
              const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
              g.addColorStop(0, `color-mix(in srgb, ${line} 28%, transparent)`);
              g.addColorStop(1, `color-mix(in srgb, ${line} 0%, transparent)`);
              return g;
            },
          }],
        },
        options: {
          plugins: { legend: { display: false }, datalabels: { display: false }, tooltip: { callbacks: { title: (i) => `${i[0].label}`, label: (i) => ` ${nf.format(i.parsed.y)} mensajes` } } },
          scales: { x: { ...xCat() }, y: { ...yGrid() } },
          interaction: { mode: 'index', intersect: false },
        },
      });
    }
    function vbar(id, labels, values, opts = {}) {
      const el = $(`#${id}`); if (!el) return;
      charts[id] = new window.Chart(el, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: opts.color || cssVar('--series-1'), borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 34 }] },
        options: {
          plugins: { legend: { display: false }, datalabels: { display: false }, tooltip: { callbacks: opts.tooltip || { label: (i) => ` ${nf.format(i.parsed.y)}` } } },
          scales: { x: { ...xCat(), ticks: { ...xCat().ticks, maxRotation: 0, autoSkip: true, autoSkipPadding: 8 } }, y: yGrid() },
        },
      });
    }

    /* ---------- DETALLE ---------- */
    function renderDetalle() {
      const m = state.model;

      fitDays('d_volume', m.byDay.length, 46);
      charts.d_volume = new window.Chart($('#d_volume'), {
        type: 'bar',
        data: {
          labels: dayTicks(m.byDay.map((x) => x.date)),
          datasets: [
            { label: 'Preguntas de la gente', data: m.byDay.map((x) => x.inbound), backgroundColor: cssVar('--series-1'), borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 22, categoryPercentage: 0.7 },
            { label: 'Respuestas de Oskitar', data: m.byDay.map((x) => x.outbound), backgroundColor: cssVar('--series-2'), borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 22, categoryPercentage: 0.7 },
          ],
        },
        options: { plugins: { legend: { position: 'bottom' }, datalabels: { display: false } }, scales: { x: { ...xCat(), ticks: { ...xCat().ticks, maxRotation: 0, autoSkip: true, autoSkipPadding: 8 } }, y: { ...yGrid() } } },
      });

      const rt = m.responseTime;
      $('#d_rtHint').textContent = `Mediana ${dec1(rt.medianSec)} s · promedio ${dec1(rt.avgSec)} s · ${nf.format(rt.samples)} respuestas medidas`;
      charts.d_rt = new window.Chart($('#d_rt'), {
        type: 'bar',
        data: { labels: rt.buckets.map((b) => b.label), datasets: [{ data: rt.buckets.map((b) => b.count), backgroundColor: cssVar('--series-1'), borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 46 }] },
        options: {
          layout: { padding: { top: 24 } },
          plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'end', clamp: true, offset: 2, color: cssVar('--text-secondary'), font: { size: 11, weight: '600' }, formatter: (v) => (v ? nf.format(v) : '') } },
          scales: { x: xCat(), y: { ...yGrid(), grace: '16%' } },
        },
        plugins: DL(),
      });

      renderPeopleByDay();

      const f = m.funnel;
      hbar('d_funnel', f.map((x) => x.stage), f.map((x) => x.count), {
        padRight: 74,
        formatter: (v, c) => `${nf.format(v)}  ·  ${f[c.dataIndex].pctOfStart}%`,
        tooltip: { label: (i) => ` ${nf.format(i.parsed.x)} conversaciones (${f[i.dataIndex].pctOfStart}% del inicio)` },
      });

      const c = m.contingencyResponses;
      if (c.length) hbar('d_cont', c.map((x) => x.reason), c.map((x) => x.count), { tooltip: { label: (i) => ` ${nf.format(i.parsed.x)} veces` } });
      else $('#d_cont').closest('.card').style.display = 'none';

      const md = m.contentDelivered;
      if (md.length) hbar('d_media', md.map((x) => x.title), md.map((x) => x.count), { padRight: 40, tooltip: { label: (i) => ` ${nf.format(i.parsed.x)} envíos · ${md[i.dataIndex].type}` } });
      else $('#d_media').closest('.card').style.display = 'none';

      renderUsers();
    }

    /* ---------- Personas que escriben por día (barras + detalle) ---------- */
    function renderPeopleByDay() {
      const pd = state.model.peopleByDay || [];
      const byd = new Map(pd.map((d) => [d.date, d]));
      const days = (state.model.byDay || []).filter((d) => byd.has(d.date));
      if (state.pdDay && !byd.has(state.pdDay)) state.pdDay = null;

      const avg = days.length ? Math.round(days.reduce((a, d) => a + d.users, 0) / days.length) : 0;
      $('#pdChip').textContent = days.length ? `≈ ${nf.format(avg)} personas/día` : 'Sin datos';

      const base = cssVar('--series-1');
      const dim = 'color-mix(in srgb, ' + base + ' 32%, transparent)';
      const colors = () => days.map((d) => (state.pdDay && d.date !== state.pdDay ? dim : base));
      const many = days.length > 12;
      fitDays('d_people', days.length);

      charts.d_people = new window.Chart($('#d_people'), {
        type: 'bar',
        data: {
          labels: dayTicks(days.map((d) => d.date)),
          datasets: [{ data: days.map((d) => d.users), backgroundColor: colors(), borderRadius: 5, borderSkipped: 'bottom', maxBarThickness: 46 }],
        },
        options: {
          onClick: (evt, els) => {
            if (!els.length) return;
            const date = days[els[0].index].date;
            state.pdDay = state.pdDay === date ? null : date;
            charts.d_people.data.datasets[0].backgroundColor = colors();
            charts.d_people.update();
            renderPdDetail(byd);
          },
          onHover: (evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
          layout: { padding: { top: 22 } },
          plugins: {
            legend: { display: false },
            datalabels: { display: !many, anchor: 'end', align: 'end', clamp: true, offset: 2, color: cssVar('--text-secondary'), font: { size: 12, weight: '700' }, formatter: (v) => (v ? nf.format(v) : '') },
            tooltip: { callbacks: { title: (i) => fmtDateLong(days[i[0].dataIndex].date), label: (i) => ` ${nf.format(i.parsed.y)} personas · toca para ver quiénes` } },
          },
          scales: { x: { ...xCat(), ticks: { ...xCat().ticks, maxRotation: 0, autoSkip: true, autoSkipPadding: 8 } }, y: { ...yGrid(), grace: '14%' } },
        },
        plugins: DL(),
      });

      renderPdDetail(byd);
    }
    function renderPdDetail(byd) {
      const box = $('#pdDetail');
      const rec = state.pdDay && byd.get(state.pdDay);
      if (!rec) { box.hidden = true; box.innerHTML = ''; return; }
      const ppl = rec.people;
      const rows = ppl.map((p, i) => `<tr>
        <td>${i + 1}</td>
        <td class="txt"><strong>${esc(p.phone)}</strong></td>
        <td class="txt">${esc(p.name || '—')}</td>
        <td>${nf.format(p.messages)}</td>
      </tr>`).join('');
      box.innerHTML = `
        <h4>${fmtDateLong(state.pdDay)} — <span class="cd-count">${nf.format(ppl.length)} ${ppl.length === 1 ? 'persona escribió' : 'personas escribieron'}</span></h4>
        <div class="data-table-wrap"><table class="data">
          <thead><tr><th>#</th><th>Teléfono</th><th>Nombre</th><th>Mensajes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
      box.hidden = false;
    }

    function renderUsers() {
      const cols = [
        { k: 'phone', l: 'Teléfono', txt: 1 }, { k: 'name', l: 'Nombre', txt: 1 }, { k: 'document', l: 'Documento', txt: 1 },
        { k: 'sessions', l: 'Conversac.' }, { k: 'totalMessages', l: 'Mensajes' }, { k: 'inbound', l: 'Preguntas' },
        { k: 'categories', l: 'Temas', txt: 1, ns: 1 },
        { k: 'validated', l: 'Se identificó' },
        { k: 'lastInteraction', l: 'Última vez' },
      ];
      let rows = state.users.slice();
      const q = state.userFilter;
      if (q) rows = rows.filter((u) => [u.phone, u.name, u.document, (u.categories || []).join(' '), u.lastMessage].some((v) => String(v || '').toLowerCase().includes(q)));
      const { key, dir } = state.userSort;
      rows.sort((a, b) => {
        let va = a[key]; let vb = b[key];
        if (va == null) return 1; if (vb == null) return -1;
        if (typeof va === 'string') return va.localeCompare(vb) * dir;
        return (va - vb) * dir;
      });
      const head = `<thead><tr>${cols.map((c) => `<th data-key="${c.k}"${c.ns ? ' data-ns="1"' : ''}>${esc(c.l)}<span class="arrow">${state.userSort.key === c.k ? (dir === -1 ? ' ▼' : ' ▲') : ''}</span></th>`).join('')}</tr></thead>`;
      const body = `<tbody>${rows.map((u) => `<tr>
        <td class="txt"><strong>${esc(u.phone)}</strong></td>
        <td class="txt">${esc(u.name || '—')}</td>
        <td class="txt">${esc(u.document || '—')}</td>
        <td>${u.sessions}</td><td>${u.totalMessages}</td><td>${u.inbound}</td>
        <td class="txt">${(u.categories || []).length ? u.categories.map((x) => `<span class="tag">${esc(x)}</span>`).join('') : '—'}</td>
        <td>${u.validated ? '<span class="pill ok">sí</span>' : '<span class="pill na">no</span>'}</td>
        <td>${fmtDateTime(u.lastInteraction)}</td>
      </tr>`).join('')}</tbody>`;
      $('#usersTable').innerHTML = head + body;
      $('#userCount').textContent = `${rows.length} de ${state.users.length} personas`;
      $('#usersTable').querySelectorAll('th').forEach((th) => {
        if (th.dataset.ns) return;
        th.addEventListener('click', () => {
          const kk = th.dataset.key;
          if (state.userSort.key === kk) state.userSort.dir *= -1; else state.userSort = { key: kk, dir: -1 };
          renderUsers();
        });
      });
    }

    function renderFooter() {
      const m = state.model.meta;
      const note = m.timingNote ? ` · ${esc(m.timingNote)}` : '';
      $('#footer').innerHTML = `Datos del ${fmtDate(m.rangeStart)} al ${fmtDate(m.rangeEnd)} · ${m.daysCovered} días · actualizado ${fmtDateTime(m.generatedAt)}${note} · <a href="${apiBase()}/health" target="_blank">estado del servicio</a>`;
    }

    /* ================= BETTY ================= */
    function bettyTypeName(t) {
      return ({ text: 'Texto', interactive: 'Botón / menú', image: 'Imagen', reaction: 'Reacción', unsupported: 'No soportado' }[t]) || 'Otro';
    }

    function buildBettyShell() {
      $('#main').innerHTML = `
        <div class="card hero" style="--i:0">
          <div>
            <div class="eyebrow">Lo esencial del periodo</div>
            <p class="narr" id="b_narr"></p>
          </div>
          <div class="ring-wrap" id="b_ringWrap">
            ${ringSVG('warn')}
            <div class="ring-label"><b id="b_ringPct">0%</b><span>cayeron en<br>“No disponible”</span></div>
          </div>
        </div>
        <div class="kpi-row" id="b_kpiRow"></div>

        <div class="card alert" style="--i:5; margin-top:18px">
          <div class="card-head"><div><h3>Alerta · opción “No disponible”</h3><p class="insight" id="b_naInsight"></p></div><span class="chip warn">⚠ revisar menú</span></div>
          <div class="prop" id="b_naBar"></div>
          <div class="prop-legend" id="b_naLegend"></div>
        </div>

        <div class="grid-2 mt">
          <div class="card" style="--i:6">
            <div class="card-head"><div><h3>¿Para qué usan a Betty?</h3><p class="insight" id="b_flowInsight"></p></div></div>
            <div class="chart-box h-md"><canvas id="b_flows" aria-label="Flujos más usados"></canvas></div>
          </div>
          <div class="card" style="--i:7">
            <div class="card-head"><div><h3>¿Qué escriben los clientes?</h3><p class="insight">Clasificación del texto libre</p></div></div>
            <div class="chart-box h-md"><canvas id="b_intents" aria-label="Intenciones de los clientes"></canvas></div>
          </div>
        </div>

        <div class="grid-2 mt">
          <div class="card" style="--i:8">
            <div class="card-head"><div><h3>¿A qué horas escriben?</h3><p class="insight">Aproximado (state-manager)</p></div><span class="chip" id="b_peakChip">—</span></div>
            <div class="chart-box h-md"><canvas id="b_hour" aria-label="Actividad por hora"></canvas></div>
          </div>
          <div class="card" style="--i:9">
            <div class="card-head"><div><h3>Actividad por día</h3></div></div>
            <div class="chart-scroll"><div class="chart-box h-md"><canvas id="b_day" aria-label="Actividad por día"></canvas></div></div>
          </div>
        </div>

        <div class="grid-2 mt">
          <div class="card" style="--i:10">
            <div class="card-head"><div><h3>Recorrido: consultar resultados</h3><p class="insight" id="b_funnelInsight"></p></div></div>
            <div class="chart-box h-md"><canvas id="b_funnel" aria-label="Embudo del flujo Resultados"></canvas></div>
          </div>
          <div class="card" style="--i:11">
            <div class="card-head"><div><h3>Clientes más activos</h3><p class="insight">Por cantidad de mensajes</p></div></div>
            <ul class="rank" id="b_rank"></ul>
          </div>
        </div>

        <div class="card" style="--i:12; margin-top:18px">
          <div class="card-head"><div><h3>Tipos de mensaje</h3></div></div>
          <div class="mini-row" id="b_types"></div>
        </div>

        <div class="section-title">Clientes</div>
        <div class="card" style="--i:0">
          <div class="users-controls">
            <input type="search" class="search" id="b_custSearch" placeholder="Buscar por teléfono, tema o flujo…" />
            <span class="insight" id="b_custCount"></span>
          </div>
          <div class="users-table-wrap"><table class="users" id="b_custTable"></table></div>
        </div>
      `;
      const se = $('#b_custSearch');
      if (se) { se.value = state.bettyFilter; se.addEventListener('input', (e) => { state.bettyFilter = e.target.value.toLowerCase().trim(); renderBettyCustomers(); }); }
    }

    function renderBetty() {
      const m = state.model; const k = m.kpis;
      const topFlow = m.flows[0]; const topIntent = m.intents[0];

      let n = `Entre el <strong>${fmtDate(m.meta.rangeStart)}</strong> y el <strong>${fmtDate(m.meta.rangeEnd)}</strong>, Betty atendió a <strong>${nf.format(k.uniqueCustomers)} clientes</strong> con <strong>${nf.format(k.totalMessages)} mensajes</strong>.`;
      n += ` El <strong>${Math.round(k.notAvailableRate)}%</strong> de las interacciones cayó en la opción <strong>“No disponible”</strong>.`;
      if (topIntent) n += ` Lo más pedido: <strong>${esc(topIntent.intent.toLowerCase())}</strong>.`;
      $('#b_narr').innerHTML = n;
      $('#b_ringPct').textContent = `${Math.round(k.notAvailableRate)}%`;
      setRing($('#b_ringWrap'), k.notAvailableRate);

      const withHour = m.byDay.reduce((a, d) => a + d.count, 0);
      $('#b_kpiRow').innerHTML = [
        kpiNum('users', 'Clientes únicos', k.uniqueCustomers, `${dec1(k.messagesPerCustomer)} mensajes por cliente`, '', ''),
        kpiNum('chat', 'Mensajes recibidos', k.totalMessages, `${nf.format(withHour)} eventos con hora registrada`, sparkline(m.byDay.map((d) => d.count)), ''),
        kpiNum('repeat', 'Consultas de autoservicio', k.flowsStarted, 'flujos iniciados (resultados · chance · ubicación)', '', ''),
        kpiWarn('alert', '“No disponible”', `${Math.round(k.notAvailableRate)}%`, `${nf.format(m.notAvailable.customers)} de ${nf.format(m.notAvailable.totalCustomers)} clientes lo vieron`),
      ].join('');
      runCounters($('#b_kpiRow'));

      // Alerta "No disponible"
      $('#b_naInsight').textContent = `${nf.format(m.notAvailable.count)} de ${nf.format(k.totalMessages)} interacciones. Es casi la mitad del tráfico — conviene revisar ese menú.`;
      const na = Math.round(m.notAvailable.pct);
      const rest = 100 - na;
      $('#b_naBar').innerHTML = `
        <div class="prop-seg warn" style="flex:${Math.max(na, 0.001)}"><b>${na}%</b></div>
        <div class="prop-seg ok2" style="flex:${Math.max(rest, 0.001)}"><b>${rest}%</b></div>`;
      $('#b_naLegend').innerHTML = `
        <span><i style="background:var(--warning)"></i>Opción “No disponible” (${nf.format(m.notAvailable.count)})</span>
        <span><i style="background:var(--accent)"></i>Resto de interacciones</span>`;

      // Flujos
      $('#b_flowInsight').textContent = topFlow ? `Sobre todo ${topFlow.name.toLowerCase()}.` : 'Sin flujos registrados.';
      hbar('b_flows', m.flows.map((f) => f.name), m.flows.map((f) => f.starts), {
        padRight: 90,
        formatter: (v, c) => `${nf.format(v)}  ·  ${m.flows[c.dataIndex].customers} cli.`,
        tooltip: { label: (i) => ` ${nf.format(i.parsed.x)} veces · ${m.flows[i.dataIndex].customers} clientes` },
      });

      // Intenciones
      hbar('b_intents', m.intents.map((x) => x.intent), m.intents.map((x) => x.count), {
        padRight: 56,
        formatter: (v, c) => `${nf.format(v)}  ·  ${Math.round(m.intents[c.dataIndex].pct)}%`,
      });

      // Hora
      const peak = m.byHour.reduce((a, b) => (b.count > a.count ? b : a), { count: -1, hour: 0 });
      $('#b_peakChip').textContent = peak.count > 0 ? `Hora pico · ${fmtHour(peak.hour)}` : 'Sin datos';
      areaChart('b_hour', m.byHour.map((x) => `${String(x.hour).padStart(2, '0')}h`), m.byHour.map((x) => x.count));

      // Día
      fitDays('b_day', m.byDay.length, 40);
      vbar('b_day', dayTicks(m.byDay.map((d) => d.date)), m.byDay.map((d) => d.count), {
        tooltip: { label: (i) => ` ${nf.format(i.parsed.y)} eventos` },
      });

      // Embudo Resultados
      const f = m.resultadosFunnel;
      const dateStage = f.find((s) => /fecha/i.test(s.stage));
      $('#b_funnelInsight').textContent = (dateStage && f[0].count)
        ? `Solo ${dateStage.count} de ${f[0].count} indican una fecha; el resto consulta el día actual.`
        : 'Clientes distintos que pasan por cada paso.';
      hbar('b_funnel', f.map((s) => s.stage), f.map((s) => s.count), {
        padRight: 64,
        formatter: (v, c) => `${nf.format(v)}  ·  ${f[c.dataIndex].pctOfStart}%`,
        tooltip: { label: (i) => ` ${nf.format(i.parsed.x)} clientes (${f[i.dataIndex].pctOfStart}%)` },
      });

      // Ranking
      const top = m.topCustomers.slice(0, 6); const mx = top.length ? top[0].count : 1;
      $('#b_rank').innerHTML = top.map((u, i) => `
        <li>
          <span class="pos">${i + 1}</span>
          <span class="who"><div class="nm">${esc(u.label)}</div><div class="track"><div class="fill" style="width:${Math.max(4, (u.count / mx) * 100)}%"></div></div></span>
          <span class="n">${nf.format(u.count)}</span>
        </li>`).join('') || '<li>Sin datos.</li>';

      // Tipos de mensaje
      $('#b_types').innerHTML = m.messageTypes.map((t) => mini('list', Math.round(t.pct), '%', `${bettyTypeName(t.type)} · ${nf.format(t.count)}`)).join('');
      runCounters($('#b_types'));

      renderBettyCustomers();
      renderFooter();
    }

    function renderBettyCustomers() {
      const cols = [
        { k: 'phone', l: 'Teléfono', txt: 1 },
        { k: 'messages', l: 'Mensajes' },
        { k: 'notAvailable', l: '“No disponible”' },
        { k: 'flowEvents', l: 'Consultas' },
        { k: 'flows', l: 'Flujos', txt: 1, ns: 1 },
        { k: 'topIntent', l: 'Tema principal', txt: 1 },
        { k: 'lastActivity', l: 'Última vez' },
      ];
      let rows = (state.model.customers || []).slice();
      const q = state.bettyFilter;
      if (q) {
        rows = rows.filter((c) => [c.phone, c.topIntent, (c.flows || []).join(' ')]
          .some((v) => String(v || '').toLowerCase().includes(q)));
      }
      const { key, dir } = state.bettySort;
      rows.sort((a, b) => {
        let va = a[key];
        let vb = b[key];
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'string') return va.localeCompare(vb) * dir;
        return (va - vb) * dir;
      });
      const head = `<thead><tr>${cols.map((c) => `<th data-key="${c.k}"${c.ns ? ' data-ns="1"' : ''}>${esc(c.l)}<span class="arrow">${key === c.k ? (dir === -1 ? ' ▼' : ' ▲') : ''}</span></th>`).join('')}</tr></thead>`;
      const body = `<tbody>${rows.map((c) => `<tr>
        <td class="txt"><strong>${esc(c.phone)}</strong></td>
        <td>${c.messages}</td>
        <td>${c.notAvailable ? `<span class="pill esc">${c.notAvailable}</span>` : '<span class="pill na">0</span>'}</td>
        <td>${c.flowEvents}</td>
        <td class="txt">${(c.flows || []).length ? c.flows.map((f) => `<span class="tag">${esc(f)}</span>`).join('') : '—'}</td>
        <td class="txt">${esc(c.topIntent || '—')}</td>
        <td>${c.lastActivity ? fmtDateTime(c.lastActivity) : '—'}</td>
      </tr>`).join('')}</tbody>`;
      $('#b_custTable').innerHTML = head + body;
      $('#b_custCount').textContent = `${rows.length} de ${(state.model.customers || []).length} clientes`;
      $('#b_custTable').querySelectorAll('th').forEach((th) => {
        if (th.dataset.ns) return;
        th.addEventListener('click', () => {
          const kk = th.dataset.key;
          if (state.bettySort.key === kk) state.bettySort.dir *= -1;
          else state.bettySort = { key: kk, dir: -1 };
          renderBettyCustomers();
        });
      });
    }

    /* ---------------- init ---------------- */
    initTheme();
    [...$('#viewSeg').children].forEach((b) => b.classList.toggle('on', b.dataset.view === state.view));
    wire();
    initBots().then(() => { applyChromeForBot(); load().then(connectStream); });
  }());
  </script>
</body>
</html>
