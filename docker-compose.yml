x-cctv-environment: &cctv-environment
  TZ: America/Bogota
  CCTV_API_HOST: 0.0.0.0
  CCTV_API_PORT: 3003
  CCTV_DATA_ROOT: /var/lib/skylab-security/data
  CCTV_DB: /var/lib/skylab-security/data/cctv-staging.db
  IMAP_STATE_PATH: /var/lib/skylab-security/state/state.json
  EVENT_SNAPSHOT_DIR: /var/lib/skylab-security/data/event-snapshots
  SUPPORT_IMAGE_DIR: /var/lib/skylab-security/data/support-images
  CCTV_LOG_DIR: /var/lib/skylab-security/logs
  CCTV_REPORT_DIR: /var/lib/skylab-security/reports
  CCTV_OUTPUT_DIR: /var/lib/skylab-security/output
  EXCEL_OUTPUT_PATH: /var/lib/skylab-security/output/CCTV_Eventos.xlsx
  SIIS_SNAPSHOT_PATH: /var/lib/skylab-security/data/siis-snapshot-latest.json
  TRELLO_CACHE_DB: /var/lib/skylab-security/trello/skylab-tareas.db
  TRELLO_ENV_FILE: /run/secrets/trello.env
  TRELLO_BACKEND_ROOT: /opt/trello-backend
  DATABASE_PATH: /var/lib/skylab-security/trello/skylab-tareas.db

x-cctv-volumes: &cctv-volumes
  - ./cctv-automation-final/data:/var/lib/skylab-security/data
  - ./cctv-automation-final/state.json:/var/lib/skylab-security/state/state.json
  - ./cctv-automation-final/logs:/var/lib/skylab-security/logs
  - ./cctv-automation-final/reports:/var/lib/skylab-security/reports
  - ./cctv-automation-final/output:/var/lib/skylab-security/output
  - ./CRM_Frontend/Table Trello/backend/data:/var/lib/skylab-security/trello
  - ./CRM_Frontend/Table Trello/backend/.env:/run/secrets/trello.env:ro

services:
  comercial-bot:
    build:
      context: .
    container_name: comercial-bot
    restart: always
    env_file: [.env]
    ports: ["3001:3001"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm start

  comercial-worker:
    build:
      context: .
    container_name: comercial-worker
    restart: always
    env_file: [.env]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: node src/worker.js

  asamblea-bot:
    build:
      context: ./Asamblea
    container_name: asamblea-bot
    restart: always
    env_file: [./Asamblea/.env]
    ports: ["3002:3002"]
    volumes:
      - ./Asamblea:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm start

  asamblea-worker:
    build:
      context: ./Asamblea
    container_name: asamblea-worker
    restart: always
    env_file: [./Asamblea/.env]
    volumes:
      - ./Asamblea:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: node src/worker.js

  crm-frontend:
    build:
      context: ./CRM_Frontend
      args:
        - VITE_BACKEND_URL=http://192.168.8.65:3001
        - VITE_MONITORING_BACKEND_URL=http://192.168.8.65:3001
        - VITE_SUPABASE_URL=https://fxlbqlzsbrgnkpcduzxt.supabase.co
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_SERVICES_TI_BACKEND_URL=http://192.168.8.65:3004
        - VITE_SUPPORT_BOT_URL=http://192.168.8.65:3006
        - VITE_CCTV_API_BASE=
    container_name: crm-frontend
    restart: always
    ports: ["3003:80"]
    environment:
      - TZ=America/Bogota
    depends_on:
      cctv-api:
        condition: service_healthy
      cybersecurity-api:
        condition: service_healthy
      chatbot-soporte:
        condition: service_started

  chatbot-soporte:
    build:
      context: ./ChatBotSoporte
    container_name: chatbot-soporte
    restart: always
    env_file: [./ChatBotSoporte/.env]
    ports: ["3006:3006"]
    volumes:
      - ./ChatBotSoporte:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm run start

  cybersecurity-api:
    build:
      context: ./cybersecurity
      dockerfile: Dockerfile.api
    container_name: cybersecurity-api
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - CYBER_POLICY_DB=/admin-data/network-policies.db
    user: "${CYBER_INGEST_UID:-996}:${CYBERDROP_GID:-987}"
    read_only: true
    init: true
    expose: ["3005"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1770
    volumes:
      - ${CYBER_DATA_DIR:-./cybersecurity/data}:/data:ro
      - ./cybersecurity/admin-data:/admin-data:rw
    command:
      - --db
      - /data/cyber-inventory.db
      - --host
      - 0.0.0.0
      - --port
      - "3005"
      - --immutable
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/cybersecurity/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cctv-api:
    build:
      context: .
      dockerfile: cctv-automation-final/Dockerfile
    container_name: cctv-api
    restart: unless-stopped
    env_file: [./cctv-automation-final/.env]
    environment: *cctv-environment
    expose: ["3003"]
    volumes: *cctv-volumes
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/cctv/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cctv-operational-worker:
    build:
      context: .
      dockerfile: cctv-automation-final/Dockerfile
    container_name: cctv-operational-worker
    restart: unless-stopped
    env_file: [./cctv-automation-final/.env]
    environment: *cctv-environment
    volumes: *cctv-volumes
    command: npm run worker:operational

  cctv-visitor-worker:
    build:
      context: .
      dockerfile: cctv-automation-final/Dockerfile
    container_name: cctv-visitor-worker
    restart: unless-stopped
    env_file: [./cctv-automation-final/.env]
    environment: *cctv-environment
    volumes: *cctv-volumes
    command: npm run worker:visitors

  monitoreo-ti:
    build:
      context: ./monitoreo servicios
    container_name: monitoreo-ti
    restart: always
    stop_grace_period: 60s
    ports: ["3004:3004"]
    volumes:
      - ./monitoreo servicios:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
      - PORT=3004
      - POLL_INTERVAL_MS=30000
      - SSH_TIMEOUT_MS=15000
