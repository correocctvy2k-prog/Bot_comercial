version: '3.8'

services:
  # ==========================================
  # MICROSERVICIO 1: COMERCIAL (Bot Principal)
  # ==========================================
  comercial-bot:
    build:
      context: .
    container_name: comercial-bot
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm start

  comercial-worker:
    build:
      context: .
    container_name: comercial-worker
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: node src/worker.js

  # ==========================================
  # MICROSERVICIO 2: ASAMBLEA (Eventos)
  # ==========================================
  asamblea-bot:
    build:
      context: ./Asamblea
    container_name: asamblea-bot
    restart: always
    env_file:
      - ./Asamblea/.env
    ports:
      - "3002:3002"
    volumes:
      - ./Asamblea:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm start

  asamblea-worker:
    build:
      context: ./Asamblea
    container_name: asamblea-worker
    restart: always
    env_file:
      - ./Asamblea/.env
    volumes:
      - ./Asamblea:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: node src/worker.js

  # ==========================================
  # MICROSERVICIO 3: CRM FRONTEND (Vite/React)
  # ==========================================
  crm-frontend:
    build:
      context: ./CRM_Frontend
      args:
        - VITE_BACKEND_URL=http://192.168.8.65:3001
        - VITE_MONITORING_BACKEND_URL=http://192.168.8.65:3001
        - VITE_SUPABASE_URL=https://fxlbqlzsbrgnkpcduzxt.supabase.co
        - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bGJxbHpzYnJnbmtwY2R1enh0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MDIwNzg3NiwiZXhwIjoyMDg1NzgzODc2fQ.odcV7pu9oD6l3UgFTY97AljC7lCxZskuxRrd4m2Nl5Y
        - VITE_SERVICES_TI_BACKEND_URL=http://192.168.8.65:3004
    container_name: crm-frontend
    restart: always
    ports:
      - "3003:80"
    environment:
      - TZ=America/Bogota

  # ==========================================
  # MICROSERVICIO 4: MONITOR DE SERVICIOS TI
  # ==========================================
  monitoreo-ti:
    build:
      context: ./monitoreo servicios
    container_name: monitoreo-ti
    restart: always
    stop_grace_period: 60s
    ports:
      - "3004:3004"
    volumes:
      - ./monitoreo servicios:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
      - PORT=3004
      - POLL_INTERVAL_MS=30000
      - SSH_TIMEOUT_MS=8000
