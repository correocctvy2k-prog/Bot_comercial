version: '3.8'

services:
  # ==========================================
  # MICROSERVICIO 1: COMERCIAL (Bot Principal)
  # ==========================================
  comercial-bot:
    build:
      context: ./Comercial
    container_name: comercial-bot
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - ./Comercial:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm start

  comercial-worker:
    build:
      context: ./Comercial
    container_name: comercial-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./Comercial:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: node src/worker.js

  # ==========================================
  # MICROSERVICIO 2: ASAMBLEA (Eventos)
  # ==========================================
  asamblea-bot:
    build:
      context: ./Asamblea
    container_name: asamblea-bot
    restart: always
    env_file:
      - .env
    ports:
      - "3002:3002"
    volumes:
      - ./Asamblea:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: npm start

  asamblea-worker:
    build:
      context: ./Asamblea
    container_name: asamblea-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./Asamblea:/app
      - /app/node_modules
    environment:
      - TZ=America/Bogota
    command: node src/worker.js
