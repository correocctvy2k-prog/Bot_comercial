name: CRM_Frontend CI

on:
  pull_request:
    paths:
      - "CRM_Frontend/**"
      - ".github/workflows/crm-frontend.yml"
  push:
    branches: [main]
    paths:
      - "CRM_Frontend/**"
      - ".github/workflows/crm-frontend.yml"

permissions:
  contents: read

concurrency:
  group: crm-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRM_Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: CRM_Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
