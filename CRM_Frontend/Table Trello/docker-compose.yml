version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    container_name: skylab-tareas-backend
    ports:
      - "3013:3003"
    volumes:
      - ./backend/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3003
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/skylab-tareas.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3013
    container_name: skylab-tareas-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
